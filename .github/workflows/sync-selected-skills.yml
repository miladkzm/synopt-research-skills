name: Sync selected SynOpt research skills

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-selected-skills.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone upstream claude-skills repository
        run: |
          git clone --depth 1 https://github.com/alirezarezvani/claude-skills.git /tmp/claude-skills

      - name: Copy selected complete skill packages
        shell: bash
        run: |
          set -euo pipefail

          copy_skill() {
            src="$1"
            dst="$2"
            rm -rf "$dst"
            mkdir -p "$dst"
            cp -a "/tmp/claude-skills/$src/." "$dst/"
          }

          # Research and evidence
          copy_skill "research-ops/skills/market-research" "market-research"
          copy_skill "c-level-advisor/skills/competitive-intel" "competitive-intel"
          copy_skill "finance/skills/financial-analyst" "financial-analyst"
          copy_skill "c-level-advisor/skills/general-counsel-advisor" "general-counsel-advisor"

          # Market and commercial
          copy_skill "marketing-skill/skills/marketing-strategy-pmm" "marketing-strategy-pmm"
          copy_skill "business-growth/skills/sales-engineer" "sales-engineer"
          copy_skill "marketing-skill/skills/pricing-strategy" "pricing-strategy"
          copy_skill "business-growth/skills/revenue-operations" "revenue-operations"
          copy_skill "finance/business-investment-advisor/skills/business-investment-advisor" "business-investment-advisor"

          # Proposal and editing
          copy_skill "research/grants/skills/grants" "grants"
          copy_skill "business-growth/skills/contract-and-proposal-writer" "contract-and-proposal-writer"
          copy_skill "marketing-skill/skills/copy-editing" "copy-editing"

          if [ -f /tmp/claude-skills/LICENSE ]; then
            cp /tmp/claude-skills/LICENSE LICENSE
          fi

          UPSTREAM_SHA=$(git -C /tmp/claude-skills rev-parse HEAD)
          cat > README.md <<EOF
          # SynOpt Research Skills

          Dedicated public skill repository for the SynOpt deep market research and Innovation Radar proposal workflow.

          These 12 skill packages are copied without SynOpt-specific rewriting from the upstream repository:
          https://github.com/alirezarezvani/claude-skills

          ## Research and evidence
          - market-research
          - competitive-intel
          - financial-analyst
          - general-counsel-advisor

          ## Market and commercial
          - marketing-strategy-pmm
          - sales-engineer
          - pricing-strategy
          - revenue-operations
          - business-investment-advisor

          ## Proposal and editing
          - grants
          - contract-and-proposal-writer
          - copy-editing

          Upstream commit used for this sync: $UPSTREAM_SHA

          The complete directories are retained, including any scripts, references, templates, and assets shipped with each selected skill.

          The upstream MIT license and attribution are preserved in LICENSE.

          ## SkillsOverMCP endpoint

          https://mcp.skillsovermcp.com/mcp/miladkzm/synopt-research-skills
          EOF

      - name: Commit synchronized skills
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync twelve SynOpt research skills from upstream [skip ci]"
            git push origin HEAD:main
          fi
